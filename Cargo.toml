[workspace]
resolver = "3"
members = ["crates/render", "crates/shelldata", "crates/taskbar-proto", "crates/taskbar-egui", "crates/explorer-proto", "crates/guard", "crates/uwp-host", "crates/shell", "crates/devkeys"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
windows = "0.62"
windows-core = "0.62"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
