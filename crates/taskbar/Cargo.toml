[package]
name = "taskbar"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "taskbar-dev"
path = "src/bin/taskbar-dev.rs"

[target.'cfg(target_os = "windows")'.dependencies]
bus = { path = "../bus" }
render = { path = "../render" }
shelldata = { path = "../shelldata" }
windows-core.workspace = true
windows-numerics = "0.3.1"
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_LibraryLoader",
  "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation",
  "Win32_System_DataExchange", "Win32_System_Power", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
  "Win32_Networking_NetworkListManager", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_Security", "Win32_UI_Controls",
] }

[[bin]]
name = "taskbar-probe"
path = "src/bin/taskbar-probe.rs"

[[bin]]
name = "tray-test"
path = "src/bin/tray-test.rs"
