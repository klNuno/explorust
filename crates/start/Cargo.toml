[package]
name = "start"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "start-dev"
path = "src/bin/start-dev.rs"

[target.'cfg(target_os = "windows")'.dependencies]
bus = { path = "../bus" }
render = { path = "../render" }
shelldata = { path = "../shelldata" }
windows-core.workspace = true
windows-numerics = "0.3.1"
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Registry",
  "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Shutdown",
  "Win32_Storage_EnhancedStorage", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Globalization",
  "Win32_System_Search", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole",
] }
