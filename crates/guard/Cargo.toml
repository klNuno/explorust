[package]
name = "guard"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "explorust-guard"
path = "src/main.rs"

[dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console",
] }
