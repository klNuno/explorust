[package]
name = "guard"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "explorust-guard"
path = "src/main.rs"

[dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console", "Win32_UI_Shell", "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Controls", "Win32_Globalization", "Win32_System_Shutdown",
  "Win32_Security_Authorization", "Win32_System_RemoteDesktop", "Win32_System_Memory",
  "Win32_System_Environment",
  "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell_Common",
] }
