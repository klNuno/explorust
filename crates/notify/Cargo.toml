[package]
name = "notify"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "notify-dev"
path = "src/bin/notify-dev.rs"

[[bin]]
name = "explorust-notify"
path = "src/bin/explorust-notify.rs"

[target.'cfg(target_os = "windows")'.dependencies]
bus = { path = "../bus" }
render = { path = "../render" }
shelldata = { path = "../shelldata" }
windows-core.workspace = true
windows-numerics = "0.3.1"
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Notifications",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_LibraryLoader",
  "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Media_Audio",
  "Foundation", "Foundation_Collections", "ApplicationModel", "UI_Notifications", "UI_Notifications_Management", "Networking_PushNotifications", "Data_Xml_Dom",
] }
