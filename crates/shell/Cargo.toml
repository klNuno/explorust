[package]
name = "shell"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "explorust"
path = "src/main.rs"

[target.'cfg(target_os = "windows")'.dependencies]
uwp-host = { path = "../uwp-host" }
bus = { path = "../bus" }
keys = { path = "../keys" }
taskbar = { path = "../taskbar" }
desktop = { path = "../desktop" }
start = { path = "../start" }
switcher = { path = "../switcher" }
notify = { path = "../notify" }
files = { path = "../files" }
inject = { path = "../inject" }
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_System_SystemInformation",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm",
  "Win32_System_Environment", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Registry",
  "Win32_System_RemoteDesktop", "Win32_Security",
] }
