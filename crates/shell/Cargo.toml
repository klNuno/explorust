[package]
name = "shell"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "explorust"
path = "src/main.rs"

[target.'cfg(target_os = "windows")'.dependencies]
uwp-host = { path = "../uwp-host" }
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_System_SystemInformation",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm",
] }
