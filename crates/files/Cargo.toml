[package]
name = "files"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "files-dev"
path = "src/bin/files-dev.rs"

[[bin]]
name = "files-test"
path = "src/bin/files-test.rs"

[[bin]]
name = "explorust-open"
path = "src/bin/explorust-open.rs"

[target.'cfg(target_os = "windows")'.dependencies]
bus = { path = "../bus" }
shelldata = { path = "../shelldata" }
render = { path = "../render" }
menu = { path = "../menu" }
windows-core.workspace = true
windows-numerics = "0.3.1"
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_DirectComposition", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Controls", "Win32_System_Com", "Win32_System_Ole",
  "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_SystemServices",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Variant", "Win32_System_Registry", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_Storage_EnhancedStorage",
] }
