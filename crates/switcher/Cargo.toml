[package]
name = "switcher"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "switcher-dev"
path = "src/bin/switcher-dev.rs"

[[bin]]
name = "switcher-keys"
path = "src/bin/switcher-keys.rs"

[target.'cfg(target_os = "windows")'.dependencies]
bus = { path = "../bus" }
render = { path = "../render" }
shelldata = { path = "../shelldata" }
uwp-host = { path = "../uwp-host" }
windows-core.workspace = true
windows-numerics = "0.3.1"
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security",
] }
