[package]
name = "fsindex"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "explorust-index"
path = "src/bin/explorust-index/main.rs"

[dependencies]
memchr = "2.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Pipes",
  "Win32_Security", "Win32_Security_Authorization", "Win32_System_Services", "Win32_System_RemoteDesktop",
  "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core.workspace = true
