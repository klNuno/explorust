[package]
name = "viewer"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "explorust-viewer"
path = "src/bin/explorust-viewer.rs"

[target.'cfg(target_os = "windows")'.dependencies]
render = { path = "../render" }
windows-core.workspace = true
windows-numerics = "0.3.1"
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Touch", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_Controls", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant",
  "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Performance",
  "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Shell_PropertiesSystem", "Win32_Globalization",
] }
