[package]
name = "desktop"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "desktop-dev"
path = "src/bin/desktop-dev.rs"

[[bin]]
name = "desktop-mouse"
path = "src/bin/desktop-mouse.rs"

[[bin]]
name = "desktop-lively"
path = "src/bin/desktop-lively.rs"

[target.'cfg(target_os = "windows")'.dependencies]
bus = { path = "../bus" }
keys = { path = "../keys" }
menu = { path = "../menu" }
windows-core.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Registry",
  "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
