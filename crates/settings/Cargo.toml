[package]
name = "settings"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "explorust-settings"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
render = { path = "../render" }
shelldata = { path = "../shelldata" }
windows-core.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com",
  "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
  "Win32_Security", "Win32_System_Threading",
] }
