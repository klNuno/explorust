[package]
name = "uwp-host"
version = "0.2.0"
description = "Vendored nickel-uwu (shortontech/nickel 298f87a): UWP shell host without explorer.exe"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"


[features]
default = []
diagnostics = []

[lib]
name = "uwp_host"

[target.'cfg(target_os = "windows")'.dependencies]
bus = { path = "../bus" }
libloading = "0.8.9"
object = { version = "0.36.7", features = ["pe"] }
pdb = "0.8.0"
ureq = "3.4.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_ApplicationInstallationAndServicing", "Win32_Graphics_Dwm", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62.2"
