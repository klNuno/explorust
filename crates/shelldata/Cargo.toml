[package]
name = "shelldata"
edition.workspace = true
version.workspace = true
publish.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_System_Com",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading",
  "Win32_System_ProcessStatus", "Win32_Globalization", "Win32_System_SystemInformation",
  "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Time", "Win32_Graphics_Dwm",
  "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_Storage_Packaging_Appx",
] }
